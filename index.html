<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>
    <div class="game">
    <h1>Welcome to the Rock Paper Scissors Game!!</h1>
    <div class="icons">
        <div class="rock">
            <i class="fa-solid fa-hand-fist"></i>
            <label for="rock">Rock</label>
            </div>
        <div class="paper">
            <i class="fa-solid fa-hand"></i>
            <label for="paper">Paper</label>
            </div>
        <div class="scissors">
            <i class="fa-solid fa-hand-peace"></i>
            <label for="scissors">Scissors</label>
            </div>
    </div>
    <!-- <div class="iconnames">
        <p class="choice">Rock</p>
        <p class="choice">Paper</p>
        <p class="choice">Scissors</p>
    </div> -->
</div>
    <div class="buttons">
        <!-- profile is just for showing the icon, it doesn't have any functionality yet. -->
        <button id="profile" class="fa-solid fa-user">Profile</button>
        <!-- click play button to play the game -->
        <button id="playButton" onclick="playGame()">Play</button>
    </div>
    <script>
        function playGame() {
            window.location.href = "playground.html";
        }
    </script>
</body>
</html>
